      <h1>一个接口，怎样算简单？</h1>
      <div class="detail-body">
        <p>设计接口时，我会先写下调用方要完成的一个动作，再决定输入和返回值。以「查一条记录」为例，先约定记录存在、记录不存在、请求失败时，各自会返回什么。</p>
        <p>接口是否容易用，可以请一个没看过实现的人试试。看看他能不能只凭一段示例处理这三种结果。</p>
      </div>
