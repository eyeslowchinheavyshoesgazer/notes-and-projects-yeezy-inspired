      <h1>重试之前，先想想失败发生在哪</h1>
      <div class="detail-body">
        <p>客户端没收到响应时，服务端可能还没处理请求，也可能已经完成，只是响应在路上丢了。两种情况看起来都是超时，重新发一次的后果却不同。</p>
        <p>读取可以考虑自动重试。对于会改变状态的请求，先确定服务端能否识别同一次操作，再决定重试方式。</p>
      </div>
    </article>
