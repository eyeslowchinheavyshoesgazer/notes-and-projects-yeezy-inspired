      <h1>怎样写一条评估用例？</h1>
      <div class="detail-body">
        <p>先选一个模型实际遇到的输入，再写下什么样的输出算通过。比如让模型从邮件中提取日期，可以分别检查日期是否准确、邮件里缺少日期时是否会猜测。</p>
        <p>保留原始输入和失败结果，下次调整提示词后就能用同一条用例重跑。</p>
      </div>
